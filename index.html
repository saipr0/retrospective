<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Retrospective</title>
    <link rel="icon" type="image/svg+xml" href="css/assets/images/logo.svg">
    <link href="css/style.css" rel="stylesheet">
    <link id="prism-theme" href="css/prism.css" rel="stylesheet">
    <script>
      if (localStorage.getItem('theme') !== 'light') {
        document.documentElement.classList.add('dark');
      }
      document.documentElement.classList.add('archive-loading');
    </script>
  </head>
  <body>
    <div class="site-cursor"></div>

    <!-- Loading Page -->
    <div id="archive-loader" class="archive-loader" role="status" aria-live="polite">
      <div class="archive-terminal">
        <pre class="archive-art" aria-hidden="true"> _ __ ___
| '__/ __|
| |  \__ \
|_|  |___/</pre>
        <div class="archive-bar" data-loader-bar aria-label="Loading website archive">░░░░░░░░░░░░░░░░░░░░░░░░░</div>
      </div>
    </div>

    <!-- Home Page -->
    <main id="home" class="page">
      <section>
        <div id="home-start" class="post-body"></div>
      </section>

      <section>
        <div id="posts-list" class="post-body"></div>
      </section>

      <!-- <section>
        <div id="projects-list"></div>
      </section> -->
    </main>

    <!-- About Page -->
    <main id="about" class="page" style="display: none;">
      <article id="about-content"></article>
    </main>

    <!-- Post Detail Page -->
    <main id="post-detail" class="page" style="display: none;">
      <article id="post-content"></article>
    </main>

    <script src="js/lib/marked.min.js"></script>
    <script src="js/lib/prism.js"></script>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
